    carousel_caption: >
      El código de la caja se ve mal y nadie lo abre. El atril NFCTap se
      queda de pie en la barra. Un toque y WhatsApp, Instagram o Google.
      20 €. nfctap.tech
    scene: Caja con QR borroso, camarero señala, nadie saca el móvil.
    image_extra: dirty QR sticker on till, Spanish bar
    scripts:
      - >
        El QR de la caja está sucio y nadie lo abre. NFCTap es un atril de
        pie: el cliente acerca el móvil y entra en tu enlace. Impreso en
        España. Encarga en nfctap.tech. Envíos a toda España.
      - >
        Nadie escanea el papel de la caja. El atril NFCTap se ve, se toca y
        abre WhatsApp, Instagram o Google. Lo fabricamos aquí, negro y
        amarillo. nfctap.tech. Envíos a toda España.

  - id: maps_abajo
