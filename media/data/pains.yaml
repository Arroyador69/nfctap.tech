# Dolores de dueños de local en España. Cuerpo del Reel = impresión real.
# spoken_hook ~3 s. carousel_* distinto del locutado.

pains:
  - id: se_van_sin_opinar
    theme: reseñas
    money_angle: false
    hook: Se van y no opinan
    spoken_hook: Se van. Y no dejan reseña. ¿Otra vez?
    carousel_title: El cliente se va y nadie se entera
    carousel_line: El atril está en la barra. Un toque, se abre tu enlace.
    carousel_caption: >
      El QR de la caja se ignora. Un atril NFCTap en la barra abre Google,
      WhatsApp o Instagram al acercar el móvil. 20 €. Envíos a toda España.
      nfctap.tech
    scene: Barra de barrio, cliente de espaldas, dueña mira el móvil sin reseñas.
    image_extra: empty neighbourhood bar, phone on the counter, Tuesday afternoon
    scripts:
      - >
        Pagan, se van y nadie opina. El atril NFCTap está en la barra:
        acercas el móvil y se abre tu reseña, el chat o el perfil. Lo
        imprimimos aquí. Encarga en nfctap.tech. Envíos a toda España.
      - >
        El cliente sale y no toca nada. Con NFCTap el toque es en la barra,
        no un papel sucio. Google, WhatsApp o Instagram, a tu enlace. Lo
        ves en 3D en nfctap.tech. Envíos a toda España.

